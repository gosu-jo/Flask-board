<h1>게시판 상세 내용</h1>

<table>
    <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>내용</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>{{ index }}</td>
            <td>{{ post["title"] }}</td>
            <td>{{ post["author"] }}</td>
            <td>{{ post["content"] }}</td>
        </tr>
    </tbody>
</table>

<form action="/delete/{{ index }}" method="post">
    <button type="submit">삭제하기</button>
</form>

<a href="/edit/{{ index }}">수정하기</a>

<a href="/">목록으로 돌아가기</a>
